<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Foundry bot icon: a chimney with the flame inside its body, on the Action's molten orange.
       The chimney fits a 600 x 600 box centred on the canvas (margins 212 on every side), which keeps it
       inside the circle most avatar crops use. The background is full-bleed: hosts round the corners
       themselves, and transparent corners show their page background through. -->
  <defs>
    <linearGradient id="bghot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#d9480f"/></linearGradient>
    <linearGradient id="firehot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#fff3b0"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bghot)"/>
  <rect x="269" y="290" width="486" height="522" fill="#1b1f26"/>
  <rect x="212" y="212" width="600" height="84" rx="24" fill="#1b1f26"/>
  <g transform="translate(512 572) scale(0.83) translate(-512 -640)">
    <path fill="url(#firehot)" d="M512 860 C420 858 370 790 380 710 C390 630 460 600 478 530 C490 490 484 460 540 420 C534 480 580 520 598 580 C624 650 630 720 612 780 C596 830 560 862 512 860 Z"/>
    <path fill="#ffffff" d="M512 800 C465 798 440 760 446 715 C452 670 490 650 498 610 C504 580 496 566 528 540 C524 585 552 606 562 645 C576 690 578 740 566 772 C556 795 536 802 512 800 Z"/>
  </g>
</svg>
