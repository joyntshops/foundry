# Foundry: GitHub Issues → coding agent → verified pull request.
#
# Every run is one GitHub event. Foundry reads the event, rebuilds task state
# from the issue (labels + claim comment), performs the transition, and exits.
# State lives on GitHub, not on any machine. Humans drive it with three issue
# comments: `@foundry go`, `@foundry restart`, `@foundry stop`.
#
# GitHub starts issue_comment, schedule, and workflow_dispatch runs from the
# DEFAULT branch, so this file and .joynt-foundry.yml govern those runs only
# once they are on it. `gh workflow run foundry.yml --ref <branch> ...` runs
# the copy on another branch.
#
# Secrets (repository or organization level):
#   CLAUDE_CODE_OAUTH_TOKEN                   required. From `claude setup-token`; bills that Claude plan.
#   FOUNDRY_APP_ID, FOUNDRY_APP_PRIVATE_KEY   a GitHub App installed on this repo (`foundry setup-bot`).
#                                             With it, Foundry's comments and PRs carry the App's name and
#                                             its PRs trigger the repo's other workflows. Without it the
#                                             job's built-in token is used and agent PRs get no CI.
name: Foundry

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  # Foundry dispatches itself to hand a command to another issue's job (e.g.
  # sending an agent to rebase after integration moved). Also how to run the
  # workflow from a non-default branch: --ref <branch>.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      command:
        description: "Foundry command: go | restart | stop"
        required: true
        type: string
      message:
        description: Message for the agent
        required: false
        type: string
        default: ""
  # Reconcile: an in-progress issue whose run died without cleanup is marked
  # failed. Each run costs about 30 seconds of runner time.
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write        # push branches
  issues: write          # labels, claim/status comments
  pull-requests: write   # open PRs, PR comments
  checks: write          # verification results as a check run on the PR
  actions: write         # workflow_dispatch to itself; preview up/down
  deployments: write     # GitHub Deployment records for previews

jobs:
  foundry:
    # Comments: only `@foundry` commands, only on issues (not PRs), only from
    # people associated with the repo; the job then requires write permission
    # before acting. Plain comments and labels never start a run; the agent
    # reads them at its next launch. PR events: merges, and PRs into the
    # production branch (previewed when preview.pull_request_bases lists it).
    if: >-
      (github.event_name == 'issue_comment' &&
        !endsWith(github.event.comment.user.login, '[bot]') &&
        !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@foundry') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.merged == true ||
         github.event.pull_request.base.ref == '__PRODUCTION_BRANCH__')) ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.state == 'changes_requested' || github.event.review.state == 'approved')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # One job at a time per issue, declared on the job so runs filtered out by
    # the `if:` above never enter the group. `@foundry stop` cancels the issue's
    # running job; everything else queues.
    concurrency:
      group: foundry-${{ github.event.inputs.issue || github.event.issue.number || github.event.pull_request.number || github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'issue_comment' && contains(github.event.comment.body, '@foundry stop') }}

    env:
      FOUNDRY_APP_ID: ${{ secrets.FOUNDRY_APP_ID }}   # secrets aren't readable in step `if:`

    steps:
      - name: Mint GitHub App token
        id: app
        if: env.FOUNDRY_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FOUNDRY_APP_ID }}
          private-key: ${{ secrets.FOUNDRY_APP_PRIVATE_KEY }}

      # Full history so the integration branch exists for worktrees and diffs.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0

      - name: Foundry
        id: foundry
        uses: joyntshops/foundry@v0
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Keep the agent transcript
        if: always() && steps.foundry.outputs.log-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: foundry-issue-${{ steps.foundry.outputs.issue }}-run-${{ github.run_id }}
          path: ${{ steps.foundry.outputs.log-dir }}
          if-no-files-found: ignore
          retention-days: 30
